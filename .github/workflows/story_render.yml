name: Twisty! StoryVault — render & upload

on:
  # Scheduling is driven by Cloudflare Cron Triggers (see cloudflare_worker.js),
  # which fire on time — GitHub's own cron lagged 1-3hrs on free tier. The
  # Worker calls this workflow via workflow_dispatch at each slot.
  workflow_dispatch:
    inputs:
      variant:
        description: "Lane to render: short (stock footage) or cartoon. Empty = short, unless .github/cartoon_slots names this hour."
        required: false
        default: ""
      dry_run:
        description: "Render only: attach the video to the run, post nothing, put the story back in the queue."
        type: boolean
        required: false
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dry runs push the preview to the previews branch
    env:
      # Python block-buffers stdout when piped into tee, so on a timeout kill
      # the buffer is lost — run #197 uploaded to YouTube successfully and the
      # "[main] Uploaded: ..." line never reached the log. That also silently
      # truncates the tail the failure alert quotes, which is the whole point
      # of capturing it.
      PYTHONUNBUFFERED: "1"
    # Generation + render + upload needs more than 20min in the worst case:
    # run #197 rendered a 107s video successfully at 18:13:32 and was killed
    # at 18:15:05 partway through the upload. Refilling an empty queue can
    # alone take 7min against Groq's free-tier rate limits, and the render
    # another 10. 40 leaves headroom without letting a hung job idle for long.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The Worker dispatches with no inputs, so a slot handed to the cartoon
      # lane is listed in .github/cartoon_slots as a UTC hour (2026-10-08T17).
      # One line per slot; anything not listed stays on stock footage.
      - name: Pick lane for this slot
        id: lane
        shell: bash
        run: |
          V="${{ inputs.variant }}"
          HOUR=$(date -u +%Y-%m-%dT%H)
          if [ -z "$V" ] && grep -qx "$HOUR" .github/cartoon_slots 2>/dev/null; then
            V=cartoon; echo "Slot $HOUR is listed in .github/cartoon_slots"
          fi
          echo "variant=${V:-short}" >> "$GITHUB_OUTPUT"
          echo "Lane: ${V:-short}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        if: steps.lane.outputs.variant == 'cartoon'
        with:
          node-version: "22"

      - name: Install HyperFrames
        if: steps.lane.outputs.variant == 'cartoon'
        run: |
          npm install -g hyperframes@0.8.141
          hyperframes browser ensure

      # Best effort, as in story_render_long.yml. On 2026-09-30 Groq's daily
      # token allowance ran out and this step retried until the job hit its
      # timeout, so a Short that was already queued never rendered. If
      # generation fails the render still runs from the queue; if the queue
      # is truly empty, the renderer exits non-zero and the alert fires.
      - name: Top up story queue if running low
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: pin a specific Groq model. Accepted as either a repo
          # variable or a secret (Settings > Secrets and variables > Actions),
          # since neither is sensitive and it is easy to add under the wrong
          # tab. Unset lets generate_stories_cloud.py walk its fallback chain.
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
          # Optional: raise if stories start getting clipped mid-sentence.
          # Variable or secret, as above. Unset means the 4000 default in
          # generate_stories_cloud.py.
          GROQ_MAX_TOKENS: ${{ vars.GROQ_MAX_TOKENS || secrets.GROQ_MAX_TOKENS }}
        shell: bash  # gives -o pipefail, so tee does not mask a non-zero exit
        run: python generate_stories_cloud.py 2>&1 | tee -a /tmp/pipeline.log

      - name: Render + upload next queued story
        env:
          STORY_VARIANT: ${{ steps.lane.outputs.variant }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          HYPERFRAMES_CMD: hyperframes
          # The cartoon lane asks Groq for its scene plan; it falls back to a
          # keyword plan when this is missing or out of quota.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_PICKLE_B64: ${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}
          YOUTUBE_PRIVACY: "public"
          YOUTUBE_CATEGORY_ID: "24"
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        shell: bash  # gives -o pipefail, so tee does not mask a non-zero exit
        run: python render_from_supabase.py 2>&1 | tee -a /tmp/pipeline.log

      - name: Attach dry-run video
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: /tmp/preview.mp4
          if-no-files-found: warn

      # Artifacts need a browser login to download; a branch can be fetched
      # with plain git, which is how a preview gets to a phone.
      - name: Push dry-run video to the previews branch
        if: inputs.dry_run
        shell: bash
        run: |
          [ -f /tmp/preview.mp4 ] || exit 0
          cd "$(mktemp -d)"
          git init -q && git checkout -q --orphan previews
          cp /tmp/preview.mp4 "preview-${{ github.run_number }}.mp4"
          git add . && git -c user.name=storyvault -c user.email=actions@github.com commit -qm "Preview from run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews

      # Send the actual error, not just a link. A bare "it failed" meant every
      # past alert required opening Actions to learn anything; the tail of the
      # log is usually enough to tell a retired model from a real bug.
      - name: Notify Telegram on failure
        if: failure()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAIL=$(tail -c 2000 /tmp/pipeline.log 2>/dev/null || true)
          [ -n "$TAIL" ] || TAIL="(no output captured - the job died before the scripts ran)"
          MSG=$(printf 'Twisty StoryVault FAILED (run #%s)\n\n%s\n\n%s\n\nTry /logs for detail, or /fix to auto-repair a retired model.' \
            "$RUN_NUMBER" "$TAIL" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG" > /dev/null
