name: Twisty! StoryVault — render & upload

on:
  # Scheduling is driven by Cloudflare Cron Triggers (see cloudflare_worker.js),
  # which fire on time — GitHub's own cron lagged 1-3hrs on free tier. The
  # Worker calls this workflow via workflow_dispatch at each slot.
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Top up story queue if running low
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: pin a specific Groq model. Set as a repository *variable*
          # (Settings > Secrets and variables > Actions > Variables). Leave it
          # unset to let generate_stories_cloud.py pick the first model in its
          # fallback list that Groq still serves.
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python generate_stories_cloud.py

      - name: Render + upload next queued story
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_PICKLE_B64: ${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}
          YOUTUBE_PRIVACY: "public"
          YOUTUBE_CATEGORY_ID: "24"
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python render_from_supabase.py

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Twisty StoryVault render FAILED (run #${{ github.run_number }}). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
