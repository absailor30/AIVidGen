name: Twisty! StoryVault — illustrated render & upload

# Experiment lane: the same 9:16 Short, but the backdrop is generated images
# instead of Pexels stock footage. Kept as a separate variant rather than a
# switch on the short lane so both keep publishing -- "do illustrated videos
# do better?" is only answerable if the comparison stays live, and
# collect_metrics.py already records every video by variant.
#
# Deliberately manual-only for now: no schedule: block. Run it by hand from the
# Actions tab, look at the results, and add a cron once the look is right.

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: >-
          YouTube privacy for this run. Defaults to unlisted so the first
          illustrated videos can be reviewed before anything goes public.
        required: false
        default: "unlisted"
        type: choice
        options: ["unlisted", "private", "public"]

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      # Selects the illustrated profile: 9:16, 1.4x, 5s clips, subtitles on,
      # and image_mode, which generates frames and renders from those instead
      # of searching Pexels.
      STORY_VARIANT: "illustrated"
    # Longer than the 40 minutes the short lane gets: ~15 image generations at
    # up to 90s each is the new cost, and they run before the render starts.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Top up illustrated story queue if running low
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
          GROQ_MAX_TOKENS: ${{ vars.GROQ_MAX_TOKENS || secrets.GROQ_MAX_TOKENS }}
        shell: bash  # gives -o pipefail, so tee does not mask a non-zero exit
        run: python generate_stories_cloud.py 2>&1 | tee -a /tmp/pipeline.log

      - name: Render + upload next queued illustrated story
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Still required: the renderer falls back to Pexels if too few frames
          # generate, so the key has to be present even in image mode.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TOKEN_PICKLE_B64: ${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy }}
          YOUTUBE_CATEGORY_ID: "24"
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
          # Instagram stays off while the look is being judged. The profile has
          # instagram: true, so adding these two secrets later is all it takes.
        shell: bash  # gives -o pipefail, so tee does not mask a non-zero exit
        run: python render_from_supabase.py 2>&1 | tee -a /tmp/pipeline.log

      - name: Notify Telegram on failure
        if: failure()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAIL=$(tail -c 2000 /tmp/pipeline.log 2>/dev/null || true)
          [ -n "$TAIL" ] || TAIL="(no output captured - the job died before the scripts ran)"
          MSG=$(printf 'Twisty StoryVault ILLUSTRATED FAILED (run #%s)\n\n%s\n\n%s' \
            "$RUN_NUMBER" "$TAIL" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG" > /dev/null
